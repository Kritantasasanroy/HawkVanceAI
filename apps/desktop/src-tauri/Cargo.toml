[package]
name = "hawkvance"
version = "0.1.0"
description = "HawkVance AI desktop"
authors = ["HawkVance"]
edition = "2021"
rust-version = "1.77"

[lib]
# Named apart from the binary so the same code can be unit tested without the
# Tauri runtime standing up a window.
name = "hawkvance_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The vault. rusqlite is pinned to the bundled SQLCipher build so the encryption
# travels with the binary rather than depending on whatever libsqlite the machine
# happens to have.
rusqlite = { version = "0.32", features = ["bundled-sqlcipher", "chrono"] }

aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"

reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }

chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
sysinfo = "0.33"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
# The master key lives in Windows Credential Manager, never on disk beside the vault.
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Security_Credentials",
] }

[features]
# Tauri's own default. Kept explicit so a release build cannot silently pick up
# the development console.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
