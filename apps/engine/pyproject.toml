[project]
name = "hawkvance-engine"
version = "0.1.0"
description = "HawkVance local privacy and document intelligence engine"
requires-python = ">=3.11"
dependencies = [
  "presidio-analyzer>=2.2",
  "presidio-anonymizer>=2.2",
  "psutil>=6.0",
  "regex>=2024.0",
]

[project.optional-dependencies]
documents = ["docling>=2.0"]
ner = ["gliner>=0.2"]
ocr = ["paddlepaddle>=3.0", "paddleocr>=3.0"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
